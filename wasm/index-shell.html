<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>SameBoy</title>
  <style>
    .emscripten {
         padding-right: 0;
         margin-left: auto;
         margin-right: auto;
         display: block;
    }
    textarea.emscripten {
         font-family: monospace;
         width: 80%;
    }
    div.emscripten {
         text-align: center;
    }
    div.emscripten_border {
         border: 1px solid black;
    }
    /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
    canvas.emscripten {
         border: 0px none;
         background-color: black;

        image-rendering: optimizeSpeed;
        image-rendering: -moz-crisp-edges;
        image-rendering: -o-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: optimize-contrast;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
    }
    .spinner {
         height: 50px;
         width: 50px;
         margin: 0px auto;
         animation: rotation 0.8s linear infinite;
         border-left: 10px solid rgb(0,150,240);
         border-right: 10px solid rgb(0,150,240);
         border-bottom: 10px solid rgb(0,150,240);
         border-top: 10px solid rgb(100,0,200);
         border-radius: 100%;
         background-color: rgb(200,100,250);
    }
    @keyframes rotation {
         from {
            transform: rotate(0deg);
        }
         to {
            transform: rotate(360deg);
        }
    }
    </style>
</head>

<body>
  <ul id="demo-roms">
    <li><a href="ressources/demos/oh.gb">Oh!</a></li>
    <li><a href="ressources/demos/pocket.gb">Is that a demo in your pocket?</a></li>
    <li><a href="ressources/demos/gejmboj.gb">Gejmboj</a></li>
    <li><a href="ressources/demos/video.gbc">GBVP1</a></li>
    <li><a href="ressources/demos/mezase.gbc">GBVP2</a></li>
    <li><a href="ressources/demos/pht-mr.gbc">Mental Respirator</a></li>
    <li><a href="ressources/demos/pht-pz.gbc">It came from planet Zilog</a></li>
  </ul>
  <input type="file" id="file" name="file" accept=".gb,.gbc,.bin">

  <hr/>
  <figure style="overflow:visible;" id="spinner">
    <div class="spinner"></div>
    <center style="margin-top:0.5em"><strong>emscripten</strong></center>
  </figure>
  <div class="emscripten" id="status">Downloading...</div>
  <div class="emscripten">
    <progress value="0" max="100" id="progress" hidden=1></progress>
  </div>
  <div class="emscripten_border">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
  </div>
  <hr />
  <div class="emscripten">
    <input type="checkbox" id="resize">Resize canvas
    <input type="checkbox" id="pointerLock" checked>Lock/hide mouse pointer
    &nbsp;&nbsp;&nbsp;
    <input type="button" value="Fullscreen" onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked, document.getElementById('resize').checked)">
  </div>
  <hr />
  <script type='text/javascript'>
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var spinnerElement = document.getElementById('spinner');

    var Module = {
      sync_fs: function () {
        console.log("Syncing file system ...");

        FS.syncfs(function (err) {
          if (!err) {
            console.log("File system synchronized.")
          }
          else {
            console.error(err);
          }
        });
      },
      logReadFiles: true,
      printWithColors: true,
      preRun: [],
      postRun: [],
      print: function(text) {
        console.log.apply(console, arguments);
      },
      printErr: function() {
        console.error.apply(console, arguments);
      },
      canvas: (function() {
        var canvas = document.getElementById('canvas');

        // As a default initial behavior, pop up an alert when webgl context is lost. To make your
        // application robust, you may want to override this behavior before shipping!
        // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
        canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.');
          e.preventDefault(); }, false);

        return canvas;
      })(),
      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (m) {
          text = m[1];
          progressElement.value = parseInt(m[2]) * 100;
          progressElement.max = parseInt(m[4]) * 100;
          progressElement.hidden = false;
          spinnerElement.hidden = false;
        } else {
          progressElement.value = null;
          progressElement.max = null;
          progressElement.hidden = true;
          if (!text) spinnerElement.hidden = true;
        }
        statusElement.innerHTML = text;
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading...');
    window.onerror = function() {
      Module.setStatus('Exception thrown, see JavaScript console');
      spinnerElement.style.display = 'none';
      Module.setStatus = function(text) {
        if (text) Module.printErr('[post-exception status] ' + text);
      };
    };
  </script>
  {{{ SCRIPT }}}
</body>

</html>
