<!doctype html>
<html lang="en-us">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>SameBoy</title>
		<link href="css/main.css" rel="stylesheet">
	</head>
	<body>
		<div id="menu">
			<button id="synchronize">Synchronize save files</button>

			<ul id="demo-roms">
				<li><a href="demos/tobu.gb">Tobu Tobu Girl </a></li>
				<li><a href="demos/tobudx.gb">Tobu Tobu Girl DX </a></li>

				<li><a href="demos/oh.gb">Oh! </a></li>
				<li><a href="demos/pocket.gb">Is that a demo in your pocket?</a></li>
				<li><a href="demos/gejmboj.gb">Gejmboj </a></li>
				<li><a href="demos/video.gbc">GBVP1 </a></li>
				<li><a href="demos/mezase.gbc">GBVP2 </a></li>
				<li><a href="demos/pht-mr.gbc">Mental Respirator</a></li>
				<li><a href="demos/pht-pz.gbc">It came from planet Zilog</a></li>
			</ul>
		</div>

		<div id="system" class="isCGB">
			<div id="display">
				<figure id="spinner">
					<div class="spinner"></div>

					<div class="info">
						<div id="status">Downloading...</div>
						<progress hidden id="progress" max="100" value="0"></progress>
					</div>
				</figure>

				<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" width="320" height="288"></canvas>
			</div>

			<div id="controls">
				<div id="dpad">
					<span id="upButton" class="button"></span>
					<span id="rightButton" class="button"></span>
					<span id="downButton" class="button"></span>
					<span id="leftButton" class="button"></span>
				</div>

				<span id="startButton" class="button"></span>
				<span id="selectButton" class="button"></span>

				<span id="aButton" class="button"></span>
				<span id="bButton" class="button"></span>

				<span id="menuButton" class="button">
					<span></span>
					<span></span>
					<span></span>
				</span>
			</div>
		</div>

		{{{ SCRIPT }}}
	</body>
</html>
