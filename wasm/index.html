<!doctype html>
<html lang="en-us">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
		<title>SameBoy</title>
		<link href="css/main.css" rel="stylesheet">
		<link rel="icon" type="image/png" href="img/favicon.png">
	</head>
	<body>
		<div id="system" class="isCGB">
			<div id="display">
				<figure id="spinner">
					<div>
						<div class="spinner"></div>

						<div class="info">
							<div id="status">Downloading...</div>
							<progress hidden id="progress" max="100" value="0"></progress>
						</div>
					</div>
				</figure>

				<div id="canvasWrapper">
					<canvas id="canvas" width="160" height="144"></canvas>
				</div>
			</div>

			<div id="controls">
				<div class="dpadWrapper">
					<div id="dpad">
						<span id="upButton" class="button"></span>
						<span id="rightButton" class="button"></span>
						<span id="downButton" class="button"></span>
						<span id="leftButton" class="button"></span>
					</div>
				</div>

				<div class="startButtonWrapper">
					<span id="startButton" class="button"></span>
				</div>
				<div class="selectButtonWrapper">
					<span id="selectButton" class="button"></span>
				</div>

				<div class="aButtonWrapper">
					<span id="aButton" class="button"></span>
				</div>
				<div class="bButtonWrapper">
					<span id="bButton" class="button"></span>
				</div>

				<span id="menuButton" class="button small">
					<span></span>
					<span></span>
					<span></span>
				</span>

				<span id="fullscreenButton" class="button small">
					<svg><use href="img/fullscreen.svg#i"></use></svg>
				</span>
			</div>
		</div>

		<div id="saveManager" style="display: none;"></div>

		<script type="module">
			import initModule from"./index.js";

			initModule();
		</script>
	</body>
</html>
